name: function-iamrole

on:
  push:
    branches:
      - main
    paths:
      - functions/**
      - manifests/crossplane-compositions/**
      - tests/**
      - .github/workflows/function-iamrole.yml
  pull_request:
    paths:
      - functions/**
      - manifests/crossplane-compositions/**
      - tests/**
      - .github/workflows/function-iamrole.yml
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # These feed the Crossplane CLI install.sh script.
  XP_CHANNEL: stable
  XP_VERSION: v2.5.0

  # Must match spec.package's repository in
  # manifests/crossplane-compositions/function-iamrole.yaml.
  XPKG: ghcr.io/tw-cia/cia-infra-test/function-iamrole
  XPKG_VERSION: v0.1.${{ github.run_number }}

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.0

      - name: Run unit tests
        working-directory: functions
        run: uv run pytest */tests -v

  # Runs in parallel with `unit-test`, not after it -- this exercises the
  # Compositions directly via `crossplane composition render` (see
  # tests/test_render.py), which is unrelated to the function-iamrole
  # package `unit-test` builds/tests/pushes below.
  render-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.0

      - name: Setup the Crossplane CLI
        run: |
          curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh
          sudo mv crossplane /usr/local/bin/crossplane

      - name: Run composition render tests
        run: uv run pytest -vv ./tests/test_render.py

  # Also runs in parallel, independent of the others -- proves
  # functions/staticwebsite and functions/dnsvalidatedcertificate produce
  # output equivalent to their Patch-and-Transform originals (see
  # tests/test_equivalence.py). Unrelated to function-iamrole specifically,
  # same as render-test above.
  equivalence-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.0

      - name: Setup the Crossplane CLI
        run: |
          curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh
          sudo mv crossplane /usr/local/bin/crossplane

      - name: Build dev images for the Python-function Compositions
        run: |
          docker build functions/dnsvalidatedcertificate --tag function-dnsvalidatedcertificate:dev
          docker build functions/staticwebsite --tag function-staticwebsite:dev

      - name: Run equivalence tests
        run: uv run pytest -vv ./tests/test_equivalence.py

  build:
    needs: [unit-test, render-test, equivalence-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: functions/iamrole
          platforms: linux/amd64
          target: image
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/runtime-amd64.tar

      - name: Setup the Crossplane CLI
        run: curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh

      - name: Build Crossplane package
        run: |
          ./crossplane xpkg build \
            --package-root=functions/iamrole/package \
            --embed-runtime-image-tarball=/tmp/runtime-amd64.tar \
            --package-file=/tmp/function-iamrole-amd64.xpkg

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: package-amd64
          path: /tmp/function-iamrole-amd64.xpkg
          if-no-files-found: error
          retention-days: 1

  # Pushes the package built above to GHCR. Skipped on pull requests, since
  # those don't have push access and shouldn't publish packages anyway.
  push:
    if: ${{ github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: package-amd64
          path: /tmp/xpkg

      - name: Setup the Crossplane CLI
        run: curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push package
        run: ./crossplane --verbose xpkg push --package-files /tmp/xpkg/function-iamrole-amd64.xpkg "${{ env.XPKG }}:${{ env.XPKG_VERSION }}"
