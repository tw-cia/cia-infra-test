name: function-iamrole

on:
  push:
    branches:
      - main
    paths:
      - functions/iamrole/**
      - .github/workflows/function-iamrole.yml
  pull_request:
    paths:
      - functions/iamrole/**
      - .github/workflows/function-iamrole.yml
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # These feed the Crossplane CLI install.sh script.
  XP_CHANNEL: stable
  XP_VERSION: v2.5.0

  # Must match spec.package's repository in
  # manifests/crossplane-compositions/function-iamrole.yaml.
  XPKG: ghcr.io/tw-cia/cia-infra-test/function-iamrole
  XPKG_VERSION: v0.1.${{ github.run_number }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.0

      - name: Run unit tests
        working-directory: functions/iamrole
        run: uv run pytest -v

  # We build the amd64 and arm64 runtime images in parallel, then push them as
  # a single multi-platform package in the push job below.
  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: functions/iamrole
          platforms: linux/${{ matrix.arch }}
          target: image
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/runtime-${{ matrix.arch }}.tar

      - name: Setup the Crossplane CLI
        run: curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh

      - name: Build Crossplane package
        run: |
          ./crossplane xpkg build \
            --package-root=functions/iamrole/package \
            --embed-runtime-image-tarball=/tmp/runtime-${{ matrix.arch }}.tar \
            --package-file=/tmp/function-iamrole-${{ matrix.arch }}.xpkg

      - name: Upload single-platform package
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.arch }}
          path: /tmp/function-iamrole-${{ matrix.arch }}.xpkg
          if-no-files-found: error
          retention-days: 1

  # Combines the single-platform packages built above into one multi-platform
  # package and pushes it to GHCR. Skipped on pull requests, since those don't
  # have push access and shouldn't publish packages anyway.
  push:
    if: ${{ github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Download single-platform packages
        uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: /tmp/xpkg
          merge-multiple: true

      - name: Setup the Crossplane CLI
        run: curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push multi-platform package
        run: |
          files=$(ls /tmp/xpkg/*.xpkg | paste -sd, -)
          ./crossplane --verbose xpkg push --package-files "$files" "${{ env.XPKG }}:${{ env.XPKG_VERSION }}"
