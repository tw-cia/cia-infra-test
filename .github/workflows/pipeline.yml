name: pipeline

on:
  push:
    branches:
      - main
    paths:
      - functions/**
      - manifests/crossplane-compositions/**
      - scripts/**
      - tests/**
      - .github/workflows/pipeline.yml
  pull_request:
    paths:
      - functions/**
      - manifests/crossplane-compositions/**
      - scripts/**
      - tests/**
      - .github/workflows/pipeline.yml
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # These feed the Crossplane CLI install.sh script.
  XP_CHANNEL: stable
  XP_VERSION: v2.5.0

  # Shared across all three functions below. Each one's full registry path
  # is ghcr.io/tw-cia/cia-infra-test/function-<name>, matching spec.package
  # in manifests/crossplane-compositions/custom-python/function-<name>*.yaml.
  XPKG_VERSION: v0.1.${{ github.run_number }}

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Run unit tests
        working-directory: functions
        run: uv run pytest */tests -v

  # Runs in parallel with the others -- unit tests for the externalized
  # inline-python scripts (scripts/*.py), the compose(req, rsp) functions the
  # inline-python method's Jsonnet Compositions splice in via importstr.
  # Doesn't need Docker, Crossplane, or Jsonnet, just the scripts/ uv project
  # itself.
  scripts-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Run scripts tests
        working-directory: scripts
        run: uv run pytest tests -v

  # Runs in parallel with `unit-test`, not after it -- this exercises the
  # Compositions directly via `crossplane composition render`: equivalence
  # across all five implementations per composite kind (test_equivalence.py),
  # plus the render-based correctness/security/consistency/input-reflection
  # tests layered on top of that same harness. Everything under ./tests/ is
  # unrelated to the function-iamrole package `unit-test` builds/tests/pushes
  # below.
  composition-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Setup the Crossplane CLI
        run: |
          curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh
          sudo mv crossplane /usr/local/bin/crossplane

      - name: Setup the Jsonnet CLI
        run: |
          curl -sL https://github.com/google/go-jsonnet/releases/download/v0.22.0/go-jsonnet_0.22.0_linux_amd64.tar.gz \
            | tar -xz jsonnet
          sudo mv jsonnet /usr/local/bin/jsonnet

      - name: Build dev images for the custom-packaged Python functions
        run: |
          docker build functions/iamrole --tag function-iamrole:dev
          docker build functions/dnsvalidatedcertificate --tag function-dnsvalidatedcertificate:dev
          docker build functions/staticwebsite --tag function-staticwebsite:dev

      - name: Run composition tests
        run: uv run pytest -vv ./tests/

  build-iamrole:
    needs: [unit-test, composition-tests, scripts-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: functions/iamrole
          platforms: linux/amd64
          target: image
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/runtime-amd64.tar

      - name: Setup the Crossplane CLI
        run: curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh

      - name: Build Crossplane package
        run: |
          ./crossplane xpkg build \
            --package-root=functions/iamrole/package \
            --embed-runtime-image-tarball=/tmp/runtime-amd64.tar \
            --package-file=/tmp/function-iamrole-amd64.xpkg

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: package-iamrole-amd64
          path: /tmp/function-iamrole-amd64.xpkg
          if-no-files-found: error
          retention-days: 1

  build-staticwebsite:
    needs: [unit-test, composition-tests, scripts-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: functions/staticwebsite
          platforms: linux/amd64
          target: image
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/runtime-amd64.tar

      - name: Setup the Crossplane CLI
        run: curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh

      - name: Build Crossplane package
        run: |
          ./crossplane xpkg build \
            --package-root=functions/staticwebsite/package \
            --embed-runtime-image-tarball=/tmp/runtime-amd64.tar \
            --package-file=/tmp/function-staticwebsite-amd64.xpkg

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: package-staticwebsite-amd64
          path: /tmp/function-staticwebsite-amd64.xpkg
          if-no-files-found: error
          retention-days: 1

  build-dnsvalidatedcertificate:
    needs: [unit-test, composition-tests, scripts-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: functions/dnsvalidatedcertificate
          platforms: linux/amd64
          target: image
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/runtime-amd64.tar

      - name: Setup the Crossplane CLI
        run: curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh

      - name: Build Crossplane package
        run: |
          ./crossplane xpkg build \
            --package-root=functions/dnsvalidatedcertificate/package \
            --embed-runtime-image-tarball=/tmp/runtime-amd64.tar \
            --package-file=/tmp/function-dnsvalidatedcertificate-amd64.xpkg

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: package-dnsvalidatedcertificate-amd64
          path: /tmp/function-dnsvalidatedcertificate-amd64.xpkg
          if-no-files-found: error
          retention-days: 1

  # Pushes the packages built above to GHCR. Skipped on pull requests, since
  # those don't have push access and shouldn't publish packages anyway.
  push-iamrole:
    if: ${{ github.event_name != 'pull_request' }}
    needs: build-iamrole
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: package-iamrole-amd64
          path: /tmp/xpkg

      - name: Setup the Crossplane CLI
        run: curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push package
        run: ./crossplane --verbose xpkg push --package-files /tmp/xpkg/function-iamrole-amd64.xpkg "ghcr.io/tw-cia/cia-infra-test/function-iamrole:${{ env.XPKG_VERSION }}"

  push-staticwebsite:
    if: ${{ github.event_name != 'pull_request' }}
    needs: build-staticwebsite
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: package-staticwebsite-amd64
          path: /tmp/xpkg

      - name: Setup the Crossplane CLI
        run: curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push package
        run: ./crossplane --verbose xpkg push --package-files /tmp/xpkg/function-staticwebsite-amd64.xpkg "ghcr.io/tw-cia/cia-infra-test/function-staticwebsite:${{ env.XPKG_VERSION }}"

  push-dnsvalidatedcertificate:
    if: ${{ github.event_name != 'pull_request' }}
    needs: build-dnsvalidatedcertificate
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: package-dnsvalidatedcertificate-amd64
          path: /tmp/xpkg

      - name: Setup the Crossplane CLI
        run: curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push package
        run: ./crossplane --verbose xpkg push --package-files /tmp/xpkg/function-dnsvalidatedcertificate-amd64.xpkg "ghcr.io/tw-cia/cia-infra-test/function-dnsvalidatedcertificate:${{ env.XPKG_VERSION }}"
