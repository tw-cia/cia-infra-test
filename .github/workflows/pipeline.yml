name: pipeline

on:
  push:
    branches:
      - main
    paths:
      - functions/**
      - manifests/crossplane-compositions/**
      - scripts/**
      - kcl-scripts/**
      - tests/**
      - .github/workflows/pipeline.yml
  pull_request:
    paths:
      - functions/**
      - manifests/crossplane-compositions/**
      - scripts/**
      - kcl-scripts/**
      - tests/**
      - .github/workflows/pipeline.yml
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # These feed the Crossplane CLI install.sh script.
  XP_CHANNEL: stable
  XP_VERSION: v2.5.0

  # Shared across all four functions below. Each one's full registry path
  # is ghcr.io/tw-cia/cia-infra-test/function-<name>, matching spec.package
  # in manifests/crossplane-compositions/custom-python/function-<name>*.yaml.
  XPKG_VERSION: v0.1.${{ github.run_number }}

jobs:
  # Each of these runs one implementation's own fast local tests, no Docker
  # or crossplane render needed -- the three methods whose logic is
  # externalized into its own testable module rather than living entirely
  # inline in a Composition file. yaml-patching, go-templating, and kcl have
  # no equivalent job: their logic is only exercised via render-tests below.
  custom-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.0

      - name: Run tests
        working-directory: functions
        run: uv run pytest */tests -v

  inline-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.0

      - name: Run tests
        working-directory: scripts
        run: uv run pytest tests -v

  externalized-kcl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup the KCL CLI
        run: curl -fsSL https://kcl-lang.io/script/install-cli.sh | bash

      - name: Run tests
        working-directory: kcl-scripts
        run: kcl test ./...

  # Runs in parallel with the jobs above, not after them -- this exercises
  # every method's Composition directly via `crossplane composition render`.
  # tests/equivalence and tests/behaviour are two directories, not two
  # pytest invocations picking out individual files: equivalence proves the
  # six implementations per composite kind agree with each other; behaviour
  # proves what they produce is actually correct and secure, independent of
  # that agreement. See tests/harness.py's docstring for what this shares
  # with the three jobs above.
  render-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.0

      - name: Setup the Crossplane CLI
        run: |
          curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh
          sudo mv crossplane /usr/local/bin/crossplane

      - name: Setup the Jsonnet CLI
        run: |
          curl -sL https://github.com/google/go-jsonnet/releases/download/v0.22.0/go-jsonnet_0.22.0_linux_amd64.tar.gz \
            | tar -xz jsonnet
          sudo mv jsonnet /usr/local/bin/jsonnet

      - name: Build dev images for the custom-packaged Python functions
        run: |
          docker build functions/iamrole --tag function-iamrole:dev
          docker build functions/dnsvalidatedcertificate --tag function-dnsvalidatedcertificate:dev
          docker build functions/staticwebsite --tag function-staticwebsite:dev
          docker build functions/lambdafunction --tag function-lambdafunction:dev

      - name: Run equivalence tests
        run: uv run pytest -vv tests/equivalence

      - name: Run behaviour tests
        run: uv run pytest -vv tests/behaviour

  build-iamrole:
    needs: [custom-python, render-tests, inline-python, externalized-kcl]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: functions/iamrole
          platforms: linux/amd64
          target: image
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/runtime-amd64.tar

      - name: Setup the Crossplane CLI
        run: curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh

      - name: Build Crossplane package
        run: |
          ./crossplane xpkg build \
            --package-root=functions/iamrole/package \
            --embed-runtime-image-tarball=/tmp/runtime-amd64.tar \
            --package-file=/tmp/function-iamrole-amd64.xpkg

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: package-iamrole-amd64
          path: /tmp/function-iamrole-amd64.xpkg
          if-no-files-found: error
          retention-days: 1

  build-staticwebsite:
    needs: [custom-python, render-tests, inline-python, externalized-kcl]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: functions/staticwebsite
          platforms: linux/amd64
          target: image
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/runtime-amd64.tar

      - name: Setup the Crossplane CLI
        run: curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh

      - name: Build Crossplane package
        run: |
          ./crossplane xpkg build \
            --package-root=functions/staticwebsite/package \
            --embed-runtime-image-tarball=/tmp/runtime-amd64.tar \
            --package-file=/tmp/function-staticwebsite-amd64.xpkg

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: package-staticwebsite-amd64
          path: /tmp/function-staticwebsite-amd64.xpkg
          if-no-files-found: error
          retention-days: 1

  build-dnsvalidatedcertificate:
    needs: [custom-python, render-tests, inline-python, externalized-kcl]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: functions/dnsvalidatedcertificate
          platforms: linux/amd64
          target: image
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/runtime-amd64.tar

      - name: Setup the Crossplane CLI
        run: curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh

      - name: Build Crossplane package
        run: |
          ./crossplane xpkg build \
            --package-root=functions/dnsvalidatedcertificate/package \
            --embed-runtime-image-tarball=/tmp/runtime-amd64.tar \
            --package-file=/tmp/function-dnsvalidatedcertificate-amd64.xpkg

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: package-dnsvalidatedcertificate-amd64
          path: /tmp/function-dnsvalidatedcertificate-amd64.xpkg
          if-no-files-found: error
          retention-days: 1

  build-lambdafunction:
    needs: [custom-python, render-tests, inline-python, externalized-kcl]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: functions/lambdafunction
          platforms: linux/amd64
          target: image
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/runtime-amd64.tar

      - name: Setup the Crossplane CLI
        run: curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh

      - name: Build Crossplane package
        run: |
          ./crossplane xpkg build \
            --package-root=functions/lambdafunction/package \
            --embed-runtime-image-tarball=/tmp/runtime-amd64.tar \
            --package-file=/tmp/function-lambdafunction-amd64.xpkg

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: package-lambdafunction-amd64
          path: /tmp/function-lambdafunction-amd64.xpkg
          if-no-files-found: error
          retention-days: 1

  # Pushes the packages built above to GHCR. Skipped on pull requests, since
  # those don't have push access and shouldn't publish packages anyway.
  push-iamrole:
    if: ${{ github.event_name != 'pull_request' }}
    needs: build-iamrole
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: package-iamrole-amd64
          path: /tmp/xpkg

      - name: Setup the Crossplane CLI
        run: curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push package
        run: ./crossplane --verbose xpkg push --package-files /tmp/xpkg/function-iamrole-amd64.xpkg "ghcr.io/tw-cia/cia-infra-test/function-iamrole:${{ env.XPKG_VERSION }}"

  push-staticwebsite:
    if: ${{ github.event_name != 'pull_request' }}
    needs: build-staticwebsite
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: package-staticwebsite-amd64
          path: /tmp/xpkg

      - name: Setup the Crossplane CLI
        run: curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push package
        run: ./crossplane --verbose xpkg push --package-files /tmp/xpkg/function-staticwebsite-amd64.xpkg "ghcr.io/tw-cia/cia-infra-test/function-staticwebsite:${{ env.XPKG_VERSION }}"

  push-dnsvalidatedcertificate:
    if: ${{ github.event_name != 'pull_request' }}
    needs: build-dnsvalidatedcertificate
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: package-dnsvalidatedcertificate-amd64
          path: /tmp/xpkg

      - name: Setup the Crossplane CLI
        run: curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push package
        run: ./crossplane --verbose xpkg push --package-files /tmp/xpkg/function-dnsvalidatedcertificate-amd64.xpkg "ghcr.io/tw-cia/cia-infra-test/function-dnsvalidatedcertificate:${{ env.XPKG_VERSION }}"

  push-lambdafunction:
    if: ${{ github.event_name != 'pull_request' }}
    needs: build-lambdafunction
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: package-lambdafunction-amd64
          path: /tmp/xpkg

      - name: Setup the Crossplane CLI
        run: curl -sL https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh | sh

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push package
        run: ./crossplane --verbose xpkg push --package-files /tmp/xpkg/function-lambdafunction-amd64.xpkg "ghcr.io/tw-cia/cia-infra-test/function-lambdafunction:${{ env.XPKG_VERSION }}"
