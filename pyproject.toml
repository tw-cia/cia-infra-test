[project]
name = "cia-infra-test"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "jmespath>=1.1.0",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
# So `from harness import ...` resolves from tests/equivalence/ and
# tests/behaviour/ without needing __init__.py files -- tests/harness.py is
# a bare top-level module, not an installable package.
pythonpath = ["tests"]
