# Composes an IAM role (assumable by a single AWS service principal) plus one
# RolePolicyAttachment per managed policy ARN. The compose logic lives in the
# function-iamrole package (see functions/iamrole/), not inlined here, so it's
# unit-testable and reusable independently of this Composition.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: iamrole-custom-python
spec:
  compositeTypeRef:
    apiVersion: platform.cia-infra-test.io/v1alpha1
    kind: IAMRole
  mode: Pipeline
  pipeline:
    - step: compose
      functionRef:
        name: function-iamrole
    # function-iamrole never sets a desired resource's Ready field, so
    # without this step the XR would stay "Creating" forever regardless of
    # how healthy the real Role/RolePolicyAttachment are -- see
    # function-auto-ready.yaml.
    - step: auto-ready
      functionRef:
        name: function-auto-ready
