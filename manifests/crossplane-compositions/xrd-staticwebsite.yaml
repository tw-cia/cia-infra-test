apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: staticwebsites.platform.cia-infra-test.io
spec:
  group: platform.cia-infra-test.io
  names:
    kind: StaticWebsite
    plural: staticwebsites
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                bucketName:
                  type: string
                  description: Globally-unique S3 bucket name to create and serve the site from.
                region:
                  type: string
                  description: AWS region for the bucket and the CloudFront origin.
                indexDocument:
                  type: string
                  description: Index document served at the site root.
                  default: index.html
                domainName:
                  type: string
                  description: >-
                    Optional custom domain (e.g. site.example.com) to serve the
                    site on instead of the default CloudFront domain. Requires
                    hostedZoneId. Provisions an ACM certificate (DNS-validated)
                    and a Route53 alias record automatically.
                hostedZoneId:
                  type: string
                  description: >-
                    Route53 hosted zone ID to create the validation and alias
                    records in. Required if domainName is set; the zone itself
                    is not managed by this composition.
              required:
                - bucketName
                - region
            status:
              type: object
              properties:
                cloudfrontDomainName:
                  type: string
                  description: Public CloudFront domain name to actually visit the site on.
                certificateArn:
                  type: string
                  description: ARN of the ACM certificate for domainName, once requested.
                certValidationRecordName:
                  type: string
                  description: DNS name of the ACM DNS-validation record.
                certValidationRecordValue:
                  type: string
                  description: DNS value of the ACM DNS-validation record.
