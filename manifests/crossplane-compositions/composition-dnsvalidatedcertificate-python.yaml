# A Python-function equivalent of composition-dnsvalidatedcertificate.yaml --
# built to prove the two approaches produce identical output (see
# functions/dnsvalidatedcertificate/) before relying on either one further.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: dnsvalidatedcertificate-python
spec:
  compositeTypeRef:
    apiVersion: platform.cia-infra-test.io/v1alpha1
    kind: DnsValidatedCertificate
  mode: Pipeline
  pipeline:
    - step: compose
      functionRef:
        name: function-dnsvalidatedcertificate-python
    # See function-auto-ready.yaml -- without this, this Composition's
    # resources never get marked Ready regardless of their real AWS state.
    - step: auto-ready
      functionRef:
        name: function-auto-ready
