# Private S3 bucket behind CloudFront via Origin Access Control (OAC):
# CloudFront signs requests to the bucket with SigV4, the bucket policy
# only trusts the cloudfront.amazonaws.com principal scoped to this
# distribution's ARN, and public access is fully blocked at the bucket.
# The bucket policy depends on the Distribution's ARN, which only exists
# once the Distribution does -- that ordering is handled by gating the
# bucket-policy resource on status.distributionArn (Required policy).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: staticwebsite-s3-cloudfront
spec:
  compositeTypeRef:
    apiVersion: platform.cia-infra-test.io/v1alpha1
    kind: StaticWebsite
  mode: Pipeline
  pipeline:
    - step: compose
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: bucket
            base:
              apiVersion: s3.aws.m.upbound.io/v1beta1
              kind: Bucket
              spec:
                forProvider: {}
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: pod-identity
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.bucket.name
                toFieldPath: metadata.annotations[crossplane.io/external-name]
              - type: FromCompositeFieldPath
                fromFieldPath: spec.bucket.region
                toFieldPath: spec.forProvider.region
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.bucketRegionalDomainName
                toFieldPath: status.bucketDomainName

          - name: bucket-public-access-block
            base:
              apiVersion: s3.aws.m.upbound.io/v1beta1
              kind: BucketPublicAccessBlock
              spec:
                forProvider:
                  blockPublicAcls: true
                  blockPublicPolicy: true
                  ignorePublicAcls: true
                  restrictPublicBuckets: true
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: pod-identity
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.bucket.name
                toFieldPath: spec.forProvider.bucket
              - type: FromCompositeFieldPath
                fromFieldPath: spec.bucket.region
                toFieldPath: spec.forProvider.region

          - name: origin-access-control
            base:
              apiVersion: cloudfront.aws.m.upbound.io/v1beta1
              kind: OriginAccessControl
              spec:
                forProvider:
                  originAccessControlOriginType: s3
                  signingBehavior: always
                  signingProtocol: sigv4
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: pod-identity
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.bucket.name
                toFieldPath: spec.forProvider.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-oac"

          # Scoped to this distribution only, via the Required-gated
          # status.distributionArn patch below -- the policy simply isn't
          # rendered until the Distribution exists and reports its ARN.
          - name: bucket-policy
            base:
              apiVersion: s3.aws.m.upbound.io/v1beta1
              kind: BucketPolicy
              spec:
                forProvider: {}
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: pod-identity
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.bucket.name
                toFieldPath: spec.forProvider.bucket
              - type: FromCompositeFieldPath
                fromFieldPath: spec.bucket.region
                toFieldPath: spec.forProvider.region
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.bucket.name
                    - fromFieldPath: status.distributionArn
                  strategy: string
                  string:
                    fmt: >-
                      {"Version":"2012-10-17","Statement":[{"Sid":"AllowCloudFrontServicePrincipal","Effect":"Allow","Principal":{"Service":"cloudfront.amazonaws.com"},"Action":"s3:GetObject","Resource":"arn:aws:s3:::%s/*","Condition":{"StringEquals":{"AWS:SourceArn":"%s"}}}]}
                toFieldPath: spec.forProvider.policy
                policy:
                  fromFieldPath: Required

          # The following three resources only come into being when
          # spec.zone.name is set, via Required-policy patches: when the
          # source field is missing, the function skips rendering that
          # resource entirely rather than erroring.
          - name: certificate
            base:
              apiVersion: acm.aws.m.upbound.io/v1beta1
              kind: Certificate
              spec:
                forProvider:
                  region: us-east-1
                  validationMethod: DNS
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: pod-identity
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.zone.name
                toFieldPath: spec.forProvider.domainName
                policy:
                  fromFieldPath: Required
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.arn
                toFieldPath: status.certificateArn
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.domainValidationOptions[0].resourceRecordName
                toFieldPath: status.certValidationRecordName
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.domainValidationOptions[0].resourceRecordValue
                toFieldPath: status.certValidationRecordValue

          - name: cert-validation-record
            base:
              apiVersion: route53.aws.m.upbound.io/v1beta1
              kind: Record
              spec:
                forProvider:
                  type: CNAME
                  ttl: 300
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: pod-identity
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: status.certValidationRecordName
                toFieldPath: spec.forProvider.name
                policy:
                  fromFieldPath: Required
              - type: FromCompositeFieldPath
                fromFieldPath: status.certValidationRecordValue
                toFieldPath: spec.forProvider.records[0]
                policy:
                  fromFieldPath: Required
              - type: FromCompositeFieldPath
                fromFieldPath: spec.zone.id
                toFieldPath: spec.forProvider.zoneId
                policy:
                  fromFieldPath: Required

          - name: certificate-validation
            base:
              apiVersion: acm.aws.m.upbound.io/v1beta1
              kind: CertificateValidation
              spec:
                forProvider:
                  region: us-east-1
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: pod-identity
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: status.certificateArn
                toFieldPath: spec.forProvider.certificateArn
                policy:
                  fromFieldPath: Required
              - type: FromCompositeFieldPath
                fromFieldPath: status.certValidationRecordName
                toFieldPath: spec.forProvider.validationRecordFqdns[0]
                policy:
                  fromFieldPath: Required

          - name: distribution
            base:
              apiVersion: cloudfront.aws.m.upbound.io/v1beta1
              kind: Distribution
              spec:
                forProvider:
                  enabled: true
                  isIpv6Enabled: true
                  priceClass: PriceClass_100
                  restrictions:
                    geoRestriction:
                      restrictionType: none
                  viewerCertificate:
                    cloudfrontDefaultCertificate: true
                  origin:
                    - originId: s3-origin
                      originAccessControlIdSelector:
                        matchControllerRef: true
                  defaultCacheBehavior:
                    targetOriginId: s3-origin
                    viewerProtocolPolicy: redirect-to-https
                    allowedMethods: [GET, HEAD]
                    cachedMethods: [GET, HEAD]
                    # AWS managed "CachingOptimized" policy -- a fixed, global ID
                    # documented by AWS, not account-specific.
                    cachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: pod-identity
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.indexDocument
                toFieldPath: spec.forProvider.defaultRootObject
              - type: FromCompositeFieldPath
                fromFieldPath: status.bucketDomainName
                toFieldPath: spec.forProvider.origin[0].domainName
                policy:
                  fromFieldPath: Required
              - type: FromCompositeFieldPath
                fromFieldPath: spec.zone.name
                toFieldPath: spec.forProvider.aliases[0]
              # Whole-object swap: CloudFront requires exactly one of
              # cloudfrontDefaultCertificate / acmCertificateArn, so this
              # can't be done as independent field patches. No domainName
              # -> default cert (fallback); domainName set -> acm shape
              # (acmCertificateArn filled in by the next patch, once known).
              - type: FromCompositeFieldPath
                fromFieldPath: spec.zone.name
                toFieldPath: spec.forProvider.viewerCertificate
                transforms:
                  - type: match
                    match:
                      patterns:
                        - type: regexp
                          regexp: ".+"
                          result:
                            sslSupportMethod: sni-only
                            minimumProtocolVersion: TLSv1.2_2021
                      fallbackTo: Value
                      fallbackValue:
                        cloudfrontDefaultCertificate: true
              - type: FromCompositeFieldPath
                fromFieldPath: status.certificateArn
                toFieldPath: spec.forProvider.viewerCertificate.acmCertificateArn
                policy:
                  fromFieldPath: Required
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.domainName
                toFieldPath: status.cloudfrontDomainName
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.arn
                toFieldPath: status.distributionArn

          # Points domainName at the distribution. Gated on
          # status.cloudfrontDomainName, which only exists once the
          # Distribution itself has been created.
          - name: domain-alias-record
            base:
              apiVersion: route53.aws.m.upbound.io/v1beta1
              kind: Record
              spec:
                forProvider:
                  type: A
                  alias:
                    # Fixed, universal CloudFront alias-target hosted zone ID
                    # -- not account- or distribution-specific.
                    zoneId: Z2FDTNDATAQYW2
                    evaluateTargetHealth: false
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: pod-identity
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.zone.name
                toFieldPath: spec.forProvider.name
                policy:
                  fromFieldPath: Required
              - type: FromCompositeFieldPath
                fromFieldPath: spec.zone.id
                toFieldPath: spec.forProvider.zoneId
                policy:
                  fromFieldPath: Required
              - type: FromCompositeFieldPath
                fromFieldPath: status.cloudfrontDomainName
                toFieldPath: spec.forProvider.alias.name
                policy:
                  fromFieldPath: Required
