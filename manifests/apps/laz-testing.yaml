apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: laz-testing
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/chooowai-tw/cia-infra-test
    targetRevision: main
    path: manifests/laz-testing
  destination:
    name: in-cluster
    namespace: laz-testing
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
