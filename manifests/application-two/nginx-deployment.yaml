apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-tralalala
  labels:
    app: nginx
    trololo: lalalala
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx-trlaalla
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
