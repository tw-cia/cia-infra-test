# Another pass further on: the Function itself has been created and AWS
# has reported back its ARN too, and a function URL was requested -- the
# only scenario where FunctionUrl actually renders (gated on
# status.functionArn).
apiVersion: platform.cia-infra-test.io/v1alpha1
kind: LambdaFunction
metadata:
  name: laz-lambda-function-fully-observed-example
  namespace: laz-testing-crossplane
spec:
  functionName: laz-lambda-example
  runtime: python3.12
  handler: index.handler
  description: Example Lambda function created via Crossplane
  code:
    s3Bucket: laz-lambda-artifacts
    s3Key: example/function.zip
  memorySize: 256
  timeoutSeconds: 15
  environmentVariables:
    LOG_LEVEL: debug
  managedPolicyArns:
    - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess
  functionUrlEnabled: true
status:
  roleArn: arn:aws:iam::123456789012:role/laz-lambda-example-role
  functionArn: arn:aws:lambda:us-east-1:123456789012:function:laz-lambda-example
